<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 1200px;
        padding: 40px;
      }

      .login-screen {
        text-align: center;
        padding: 60px 20px;
      }

      .login-screen h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 2.5em;
      }

      .login-screen p {
        color: #666;
        margin-bottom: 40px;
        font-size: 1.1em;
      }

      .google-btn {
        background: #4285f4;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.1em;
        border-radius: 50px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s;
        text-decoration: none;
      }

      .google-btn:hover {
        background: #357ae8;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
      }

      .app-screen {
        display: none;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #f0f0f0;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .user-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }

      .logout-btn {
        background: #f44336;
        color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .logout-btn:hover {
        background: #d32f2f;
      }

      .upload-area {
        border: 3px dashed #667eea;
        border-radius: 15px;
        padding: 60px 20px;
        text-align: center;
        margin-bottom: 30px;
        background: #f8f9ff;
        transition: all 0.3s;
        cursor: pointer;
      }

      .upload-area.drag-over {
        background: #e8ebff;
        border-color: #764ba2;
        transform: scale(1.02);
      }

      .upload-area h2 {
        color: #667eea;
        margin-bottom: 15px;
      }

      .upload-area p {
        color: #666;
        margin-bottom: 20px;
      }

      .file-input {
        display: none;
      }

      .browse-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1em;
        transition: all 0.3s;
      }

      .browse-btn:hover {
        background: #764ba2;
        transform: translateY(-2px);
      }

      .upload-result {
        display: none;
        background: #e8f5e9;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
      }

      .short-link {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 15px;
      }

      .short-link input {
        flex: 1;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1em;
      }

      .copy-btn {
        background: #4caf50;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .copy-btn:hover {
        background: #45a049;
      }

      .files-section h2 {
        margin-bottom: 20px;
        color: #333;
      }

      .files-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }

      .file-card {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #e0e0e0;
        transition: all 0.3s;
      }

      .file-card:hover {
        border-color: #667eea;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .file-name {
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
        word-break: break-word;
      }

      .file-info {
        color: #666;
        font-size: 0.9em;
        margin-bottom: 15px;
      }

      .file-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .file-btn {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        transition: all 0.3s;
      }

      .btn-copy {
        background: #2196f3;
        color: white;
      }

      .btn-copy:hover {
        background: #1976d2;
      }

      .btn-open {
        background: #ff9800;
        color: white;
      }

      .btn-open:hover {
        background: #f57c00;
      }

      .btn-delete {
        background: #f44336;
        color: white;
      }

      .btn-delete:hover {
        background: #d32f2f;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #999;
      }

      .empty-state svg {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Login Screen -->
      <div id="loginScreen" class="login-screen">
        <h1>📁 File Upload App</h1>
        <p>Securely upload and share files with short links</p>
        <a href="/auth/google" class="google-btn">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="currentColor"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="currentColor"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="currentColor"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Sign in with Google
        </a>
      </div>

      <!-- App Screen -->
      <div id="appScreen" class="app-screen">
        <!-- Header -->
        <div class="header">
          <div class="user-info">
            <div>
              <div id="userEmail" style="font-size: 0.9em; color: #666"></div>
            </div>
          </div>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Upload Area -->
        <div id="uploadArea" class="upload-area">
          <h2>📤 Upload Your File</h2>
          <p>Drag and drop a file here, or click to browse</p>
          <input type="file" id="fileInput" class="file-input" />
          <button
            class="browse-btn"
            onclick="document.getElementById('fileInput').click()"
          >
            Browse Files
          </button>
        </div>

        <!-- Upload Result -->
        <div id="uploadResult" class="upload-result">
          <h3 style="color: #2e7d32; margin-bottom: 10px">
            ✅ File Uploaded Successfully!
          </h3>
          <p id="uploadedFileName" style="color: #666"></p>
          <div class="short-link">
            <input type="text" id="shortLinkInput" readonly />
            <button class="copy-btn" onclick="copyShortLink()">
              📋 Copy Link
            </button>
          </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading" style="display: none">
          <div class="spinner"></div>
          <p>Uploading file...</p>
        </div>

        <!-- Files Section -->
        <div class="files-section">
          <h2>📂 Your Files</h2>
          <div id="filesGrid" class="files-grid"></div>
          <div id="emptyState" class="empty-state" style="display: none">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"
              ></path>
              <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
            <h3>No files uploaded yet</h3>
            <p>Upload your first file to get started!</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;

      // Check authentication status on page load
      async function checkAuth() {
        try {
          const response = await fetch("/auth/status");
          const data = await response.json();

          if (data.authenticated) {
            currentUser = data.user;
            showAppScreen();
            loadUserFiles();
          } else {
            showLoginScreen();
          }
        } catch (error) {
          console.error("Auth check failed:", error);
          showLoginScreen();
        }
      }

      function showLoginScreen() {
        document.getElementById("loginScreen").style.display = "block";
        document.getElementById("appScreen").style.display = "none";
      }

      function showAppScreen() {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appScreen").style.display = "block";

        // Display user info
        document.getElementById("userEmail").textContent = currentUser.email;
      }

      async function logout() {
        try {
          await fetch("/auth/logout");
          window.location.reload();
        } catch (error) {
          console.error("Logout failed:", error);
        }
      }

      // Drag and drop functionality
      const uploadArea = document.getElementById("uploadArea");
      const fileInput = document.getElementById("fileInput");

      uploadArea.addEventListener("click", (e) => {
        if (
          e.target === uploadArea ||
          e.target.tagName === "H2" ||
          e.target.tagName === "P"
        ) {
          fileInput.click();
        }
      });

      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("drag-over");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("drag-over");
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("drag-over");

        if (e.dataTransfer.files.length > 0) {
          handleFileUpload(e.dataTransfer.files[0]);
        }
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleFileUpload(e.target.files[0]);
        }
      });

      async function handleFileUpload(file) {
        const formData = new FormData();
        formData.append("file", file);

        // Show loading
        document.getElementById("loadingIndicator").style.display = "block";
        document.getElementById("uploadResult").style.display = "none";

        try {
          const response = await fetch("/file/upload", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error("Upload failed");
          }

          const data = await response.json();

          // Hide loading
          document.getElementById("loadingIndicator").style.display = "none";

          // Show success message
          document.getElementById("uploadedFileName").textContent =
            `File: ${data.file.originalName} (${formatFileSize(data.file.fileSize)})`;
          document.getElementById("shortLinkInput").value = data.file.accessUrl;
          document.getElementById("uploadResult").style.display = "block";

          // Reset file input
          fileInput.value = "";

          // Reload files list
          loadUserFiles();
        } catch (error) {
          console.error("Upload error:", error);
          alert("Failed to upload file. Please try again.");
          document.getElementById("loadingIndicator").style.display = "none";
        }
      }

      function copyShortLink() {
        const input = document.getElementById("shortLinkInput");
        input.select();
        document.execCommand("copy");

        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = "✅ Copied!";
        setTimeout(() => {
          btn.textContent = originalText;
        }, 2000);
      }

      async function loadUserFiles() {
        try {
          const response = await fetch("/file/files");
          const jsonResponse = await response.json();
          const files = jsonResponse.files;

          const filesGrid = document.getElementById("filesGrid");
          const emptyState = document.getElementById("emptyState");

          if (files.length === 0) {
            filesGrid.innerHTML = "";
            emptyState.style.display = "block";
          } else {
            emptyState.style.display = "none";
            filesGrid.innerHTML = files
              .map((file) => createFileCard(file))
              .join("");
          }
        } catch (error) {
          console.error("Failed to load files:", error);
        }
      }

      function createFileCard(file) {
        const date = new Date(file.createdAt).toLocaleDateString();
        return `
        <div class="file-card">
          <div class="file-name">${escapeHtml(file.originalName)}</div>
          <div class="file-info">
            ${formatFileSize(file.fileSize)} • ${date}
          </div>
          <div class="file-actions">
            <button class="file-btn btn-copy" onclick="copyFileLink('${file.accessUrl}')">
              Copy Link
            </button>
            <button class="file-btn btn-open" onclick="window.open('${file.accessUrl}', '_blank')">
              Open
            </button>
            <button class="file-btn btn-delete" onclick="deleteFile('${file.shortlink}')">
              Delete
            </button>
          </div>
        </div>
      `;
      }

      function copyFileLink(url) {
        navigator.clipboard.writeText(url).then(() => {
          const btn = event.target;
          const originalText = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => {
            btn.textContent = originalText;
          }, 2000);
        });
      }

      async function deleteFile(fileId) {
        if (!confirm("Are you sure you want to delete this file?")) {
          return;
        }

        try {
          const response = await fetch(`/file/${fileId}`, {
            method: "DELETE",
          });

          if (response.ok) {
            loadUserFiles();
          } else {
            alert("Failed to delete file");
          }
        } catch (error) {
          console.error("Delete error:", error);
          alert("Failed to delete file");
        }
      }

      function formatFileSize(bytes) {
        if (bytes === 0) return "0 Bytes";
        const k = 1024;
        const sizes = ["Bytes", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (
          Math.round((bytes / Math.pow(k, i)) * 100) / 100 + " " + sizes[i]
        );
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Initialize app
      checkAuth();
    </script>
  </body>
</html>
